# Configuration version -- DO NOT CHANGE!
config-version: 0.3

# Configuration relating to Wildfire's Female Gender Mod
mod:
  # The packet format used for mod data reads/writes
  # For a list of protocols and their supported mod versions, refer to https://modrinth.com/plugin/female-gender-spigot
  # -1 picks the protocol based on the server's Minecraft version (26.1+ uses protocol 6).
  # Protocol 6 (mod 5.0.0-Beta.5 and newer) requires Paper or a fork of it.
  # Undocumented protocols will cause this plugin to disable itself on launch.
  protocol: -1

# Logging of events and debug messages
logging:
  # Whether logging should be printed out to the server console.
  enabled: true
  # Toggle the inclusion of "debug" messages with logging.
  debug: false
  # Enable raw packet data dumps (hex strings)
  verbose: false
